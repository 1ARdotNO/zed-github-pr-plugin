name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: zed-version
    attributes:
      label: Zed version
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, `gh --version`, `gh auth status` (redact tokens).
