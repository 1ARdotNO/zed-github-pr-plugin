name: MegaLinter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: megalinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/rust@e08c2b05e3dbc40af4c23f41172ef1e068a7d651 # v8
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
