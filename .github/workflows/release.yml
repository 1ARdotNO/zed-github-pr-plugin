# Release flow for the ghpr-mcp binary.
# Tag a commit with a v-prefixed semver to build and publish binaries:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

name: Release

# Least privilege: grant contents:write per-job, not to the whole workflow.
permissions: {}

jobs:
  # Create the GitHub Release first so the upload jobs have somewhere to attach to.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/create-gh-release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ghpr-mcp binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ghpr-mcp
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
