[workspace]
resolver = "2"
# The WASM extension crate is standalone (different target + toolchain), so it
# stays out of the workspace and builds on its own; see crates/zed-ghpr.
members = ["crates/ghpr-mcp"]
exclude = ["crates/zed-ghpr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/1ARdotNO/zed-github-pr-plugin"
authors = ["1ARdotNO"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
strip = true
lto = "thin"
